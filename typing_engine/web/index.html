<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="/shared/writing.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="top-bar">
        <a class="back-link" href="/">Back</a>
      </div>
      <section class="writing-workspace" aria-label="Japanese writing editor">
        <div class="writing-stage">
          <div class="writing-line">
            <div class="character-unit composer-unit">
              <div class="reading-area" aria-hidden="true"></div>
              <div class="composer-shell">
                <input
                  type="text"
                  class="main-input"
                  placeholder="入力"
                  aria-label="Japanese text input"
                  autocomplete="off"
                  autocapitalize="off"
                  spellcheck="false"
                  inputmode="text"
                  autofocus
                />
              </div>
            </div>
          </div>

          <div class="mirror-line" aria-hidden="true"></div>
        </div>

        <input
          type="text"
          class="explanation-input"
          placeholder="explanation"
          aria-label="Explanation"
          autocomplete="off"
          spellcheck="true"
        />

        <div class="status-row" aria-live="polite">
          <span class="status-message"></span>
          <button type="button" class="accept-button" disabled>Accept</button>
        </div>
      </section>
    </main>
    <script type="module" src="editor.js"></script>
  </body>
</html>
